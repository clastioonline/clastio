[project]
name = "ai-teacher-assistant-api"
version = "0.1.0"
description = "AI Teacher Assistant - API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "pillow>=10.4",
  "lxml>=5.2",
  "anthropic>=1.0",
  "openai>=1.40",
  "google-genai>=1.0",
  "stripe>=10.0",
  "dodopayments>=1.100",
  "standardwebhooks>=1.0",
  "pgvector>=0.3",
  "redis>=5.0",
  "boto3>=1.34",
  "orjson>=3.10",
  "sse-starlette>=2.1",
  "email-validator>=2.2",
  "tenacity>=8.5",
  "python-dateutil>=2.9",
  "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
