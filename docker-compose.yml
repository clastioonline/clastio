# Full stack on one machine: Postgres (pgvector), Redis, API, worker and web.
#
#   cp .env.example .env        # add at least one AI provider key for real content
#   docker compose up -d --build
#   open http://localhost:3000   (demo: sara@example.com / teacher-demo-123)
#
# For built-in demo content, explicitly set AI_OFFLINE_MODE=true.
# Live generation requires provider keys, approved price cards and enabled spending controls.

name: ai-teacher-assistant

x-backend: &backend
  build:
    context: apps/api
    args:
      BASE_IMAGE: ${API_BASE_IMAGE:-ubuntu:24.04}
  image: ai-teacher-assistant-api:local
  env_file:
    - path: ${APP_ENV_FILE:-.env}
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/teacher_assistant
    GOTENBERG_URL: http://gotenberg:3000
    REDIS_URL: redis://redis:6379/0
    STORAGE_LOCAL_DIR: /app/var/storage
    PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  volumes:
    - storage:/app/var/storage
    - ./deploy/fonts:/usr/local/share/fonts/custom:ro
  restart: unless-stopped

services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: teacher_assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teacher_assistant"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.24.1-p0}
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: teacher_assistant
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 30
      MAX_PREPARED_STATEMENTS: 100
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d teacher_assistant"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  gotenberg:
    image: ${GOTENBERG_IMAGE:-gotenberg/gotenberg:8.32.0}
    command: ["gotenberg", "--libreoffice-auto-start=true", "--api-timeout=180s", "--libreoffice-max-queue-size=20", "--libreoffice-deny-private-ips=true", "--libreoffice-deny-public-ips=true"]
    volumes:
      - ./deploy/fonts:/usr/local/share/fonts/custom:ro
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped

  # One-off: apply migrations and seed plans, templates, curricula (and demo accounts unless SEED_DEMO=false).
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/teacher_assistant
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "${API_PORT:-127.0.0.1:8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      gotenberg:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker", "--concurrency", "${WORKER_CONCURRENCY:-4}"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      gotenberg:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: apps/web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        API_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    image: ai-teacher-assistant-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  storage:
