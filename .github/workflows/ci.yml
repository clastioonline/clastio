name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · lint, migrations, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teacher_assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/teacher_assistant_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install LibreOffice and fonts (slide rendering + visual QC)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress libreoffice-writer fontconfig \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-dejavu-core \
            fonts-noto-core fonts-open-sans fonts-lato fonts-roboto fonts-comic-neue fonts-montserrat
      - name: Install Python dependencies
        run: |
          python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print(chr(10).join(p['dependencies'] + p['optional-dependencies']['dev']))" > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt -c constraints.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrations apply and match the models
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE migrations_check"
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/migrations_check alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/migrations_check alembic check
      - name: Tests
        run: python -m pytest -q

  web:
    name: Web · typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end · docker compose + browser
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Sign up → upload deck → lessons → editable PPTX → worksheet → assistant
        working-directory: apps/web
        run: node e2e/run.mjs
      - name: Background tasks survive navigation and reopening
        working-directory: apps/web
        run: npm run e2e:background
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/web/e2e/screenshots
          if-no-files-found: ignore
